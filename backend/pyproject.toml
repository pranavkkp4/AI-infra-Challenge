[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civicops-ai"
version = "0.1.0"
description = "Explainable AI for predictive municipal infrastructure maintenance"
requires-python = ">=3.12,<3.15"
dependencies = [
  "duckdb>=1.3,<2",
  "duckdb-engine>=0.17,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "polars>=1.32,<2",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.7,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
ml = [
  "faiss-cpu>=1.11,<2",
  "sentence-transformers>=5.1,<6",
]
llm = [
  "anthropic>=0.64,<1",
  "openai>=1.100,<2",
]
dev = [
  "matplotlib>=3.10,<4",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]
